# Redis configuration for Crypto Risk Platform
# Placed at: docker/redis/redis.conf

# ── General ────────────────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec

# ── Persistence ────────────────────────────────────────────────────────────────
save 900 1
save 300 10
save 60 10000

# ── Logging ────────────────────────────────────────────────────────────────────
loglevel notice
