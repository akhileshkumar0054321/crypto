# Alembic configuration file
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Async SQLAlchemy URL — overridden by env.py at runtime
sqlalchemy.url = postgresql://crypto_user:crypto_secret_pass@localhost:5432/crypto_risk_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
